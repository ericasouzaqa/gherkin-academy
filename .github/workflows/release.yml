name: Gerar executável portátil

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Gerar site estático
        run: pnpm build:pages
      - name: Gerar launcher portátil
        run: python3 scripts/make_portable_launcher.py
      - name: Publicar asset da release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/gherkin-academy-linux-macos
          generate_release_notes: true
